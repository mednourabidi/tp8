@if (park(); as p) {
  <div class="card text-center">
    <div class="card-header"><h5>{{ p.name | uppercase }}</h5></div>
    <div class="card-body text-start">
      <ul>
        <li>Date d'ouverture: {{ p.openingDate }}</li>
        @if (p.hours) { <li>Horaire : {{ p.hours }}</li> }
        @if (p.location) { <li>Localisation : {{ p.location }}</li> }
      </ul>
    </div>
    <div class="card-footer">
      <a class="btn btn-primary" routerLink="/parks">Retour</a>
    </div>
  </div>
}
