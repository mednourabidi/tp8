<h1>Liste des parcs d'attraction</h1>
<ul class="list-group">
  @for (p of parks(); track p.id) {
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <img [src]="p.photo" [alt]="p.name" width="50" height="50">
        <span>Id: {{ p.id }} <strong>{{ p.name }}</strong></span>
        <span class="badge bg-primary">{{ p.nbLikes }} <i class="bi bi-hand-thumbs-up-fill"></i></span>
      </div>
      <div class="btn-group">
        <a class="btn btn-info" [routerLink]="['/parks', p.id]">
          <i class="bi bi-info-circle-fill"></i> Infos
        </a>
        <button class="btn btn-danger" (click)="onLike(p)">
          <i class="bi bi-heart-fill"></i> Likes
        </button>
        <button class="btn btn-secondary" (click)="onDelete(p.id)">
          <i class="bi bi-trash"></i> Supprimer
        </button>
      </div>
    </li>
  }
</ul>
